# Netlify build config for the VOSIDO static site + Decap CMS.
# Recommended host: Netlify (Identity + Git Gateway work out of the box).
[build]
  command = "python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Decap uploads media and saves JSON; Netlify Identity handles login.
# In the Netlify dashboard: Site settings -> Identity -> Enable,
# then Identity -> Services -> Git Gateway -> Enable.
